name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Unzip project
        run: |
          rm -rf work && mkdir -p work out
          # সবচেয়ে নতুন zip-টা নেওয়া হয় (পুরোনো zip মিশে যেন না যায়)
          Z=$(ls -t $(find . -maxdepth 3 -name "*.zip" -not -path "./work/*") | head -n 1)
          echo "Using zip: $Z"
          unzip -q -o "$Z" -d work
          PROJ=$(dirname "$(find work -name settings.gradle.kts | head -n 1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project folder: $PROJ"
          ls "$PROJ"

      - name: Build
        run: |
          cd "$PROJ"
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"

      - name: Show errors
        if: failure()
        run: |
          echo "===== ERROR LINES ====="
          grep -nE "^e: |error:|FAILURE|What went wrong|Could not|Unresolved|Execution failed" build.log | head -n 40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClose-APK
          path: out/app-debug.apk
