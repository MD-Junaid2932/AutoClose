name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Unzip and build
        run: |
          mkdir -p work out
          for z in *.zip; do unzip -q -o "$z" -d work; done
          PROJ=$(dirname "$(find work -name settings.gradle.kts | head -n 1)")
          echo "Project folder: $PROJ"
          cd "$PROJ"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClose-APK
          path: out/app-debug.apk
